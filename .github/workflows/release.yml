name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable release tag, for example v1.2.3
        required: true
        type: string
      release_sha:
        description: Exact 40-character commit SHA tagged by the release
        required: true
        type: string
      artifact_run_id:
        description: Originating Release workflow run ID that retained the tarball
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-please:
    name: create release PR or release
    if: github.event_name == 'push' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Mint dedicated release application token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: croogie
          repositories: |
            uszyist
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    name: verify and retain release tarball
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ needs.release-please.outputs.release_tag }}
      release_sha: ${{ needs.release-please.outputs.release_sha }}
      origin_run_id: ${{ github.run_id }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.0.0
          cache: npm
      - name: Install clean dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Pack and fingerprint exact release artifact
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          ORIGIN_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-prepare.mjs --out-dir release-artifact --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --run-id "$ORIGIN_RUN_ID"
      - name: Smoke test retained tarball
        run: node scripts/package-smoke.mjs --tarball release-artifact/package.tgz
      - name: Retain verified release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uszyist-release-${{ needs.release-please.outputs.release_tag }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 90

  recover:
    name: validate retained release artifact
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ inputs.release_tag }}
      release_sha: ${{ inputs.release_sha }}
      origin_run_id: ${{ inputs.artifact_run_id }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.0.0
      - name: Download original retained artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uszyist-release-${{ inputs.release_tag }}
          path: release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Validate release identity and retained artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORIGIN_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/release-verify.mjs --artifact-dir release-artifact --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --origin-run-id "$ORIGIN_RUN_ID"

  publish:
    name: publish verified release
    needs: [prepare, recover]
    if: always() && vars.NPM_AUTOMATED_PUBLISH_ENABLED == 'true' && (needs.prepare.result == 'success' || needs.recover.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: npm-uszyist-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || needs.prepare.outputs.release_sha }}
      ORIGIN_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id || needs.prepare.outputs.origin_run_id }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.0.0
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Download retained artifact from this release run
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uszyist-release-${{ needs.prepare.outputs.release_tag }}
          path: release-artifact
      - name: Download retained artifact for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uszyist-release-${{ inputs.release_tag }}
          path: release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Validate release identity and retained artifact
        run: node scripts/release-verify.mjs --artifact-dir release-artifact --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --origin-run-id "$ORIGIN_RUN_ID"
      - name: Publish only a missing verified version
        run: node scripts/release-publish.mjs --artifact-dir "$GITHUB_WORKSPACE/release-artifact" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --origin-run-id "$ORIGIN_RUN_ID"
      - name: Smoke test exact registry version
        run: node scripts/package-smoke.mjs --registry "${RELEASE_TAG#v}"
