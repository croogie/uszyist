name: Bug report
description: Report a reproducible CLI problem with sanitized details.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Todoist tokens, npm or GitHub credentials, task content, task URLs, IDs, or unredacted output.
  - type: input
    id: version
    attributes:
      label: uszyist version
      description: Output of the installed CLI version command, if available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: "Node v24.x; macOS 15"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Sanitized reproduction
      description: Commands and steps with credentials and private task data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Remove tokens and private Todoist data.
